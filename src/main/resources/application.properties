
#NAME OF THE APPLICATION
spring.application.name=customer

#PORT
server.port=8085


#JWT SECRET TO GENERATE TOKEN
jwt.secret=sampletest

#H2 DB CONFIGURATION
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:customer
# spring.h2.console.enabled=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=always
#Boot 2.5+ runs data.sql BEFORE Hibernate creates tables; defer it so seed
#data lands after ddl-auto. Without this the app compiles but dies on startup.
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true


# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.hbm2ddl-auto=update

#SERVLET PATH
server.error.include-stacktrace=never
server.servlet.context-path=/customer

# Spring Framework and application log
logging.level.org.springframework=info
# Hibernate logs for displaying executed SQL, input and output	
logging.level.org.hibernate.SQL=trace
logging.level.org.hibernate.type.descriptor.sql=trace

# Log pattern
logging.pattern.console=%d{dd-MM-yy} %d{HH:mm:ss.SSS} %-20.20thread %5p %-25.25logger{25} %25M %4L %m%n


feign.url-auth-service=${AUTH_SERVICE_URL:localhost:8084/auth}
feign.url-account-service=${ACCOUNT_SERVICE_URL:localhost:8086/account}
spring.devtools.livereload.port= 35777

#ACTUATOR - kubernetes liveness/readiness probes
#Served under the context path: /customer/actuator/health/{liveness,readiness}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
